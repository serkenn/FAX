name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]*'   # v1.0.0, v2.1 など

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # プラットフォーム別ビルド
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04

          - name: macos-arm64
            os: macos-latest     # macOS 15, Apple Silicon

          - name: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 依存ライブラリ (OS 別) ────────────────────────────────────────────
      - name: Install librtlsdr (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y librtlsdr-dev libusb-1.0-0-dev

      - name: Install librtlsdr (macOS)
        if: runner.os == 'macOS'
        run: brew install librtlsdr

      - name: Install librtlsdr (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # MSYS2 は GitHub Windows ランナーにプリインストール済み
          C:/msys64/usr/bin/bash.exe -lc \
            "pacman -Sy --noconfirm mingw-w64-x86_64-rtl-sdr"

      # ── Python 依存 ───────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install pyinstaller numpy scipy Pillow pyrtlsdr

      # ── ビルド (Linux / macOS) ────────────────────────────────────────────
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --onefile \
            --name wefax-decoder \
            --collect-all scipy \
            --collect-all PIL \
            --hidden-import rtlsdr \
            main.py

      # ── ビルド (Windows) ──────────────────────────────────────────────────
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          MINGW="C:/msys64/mingw64/bin"

          # pyrtlsdr on Windows は rtlsdr.dll を探す (lib prefix なし)
          cp "$MINGW/librtlsdr.dll" rtlsdr.dll
          cp "$MINGW/libusb-1.0.dll" libusb-1.0.dll

          # MinGW ランタイム DLL (存在する場合のみコピー)
          for dll in libgcc_s_seh-1.dll libwinpthread-1.dll; do
            [ -f "$MINGW/$dll" ] && cp "$MINGW/$dll" .
          done

          # --add-binary フラグを動的に組み立てる
          BINS=""
          for dll in rtlsdr.dll libusb-1.0.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            [ -f "$dll" ] && BINS="$BINS --add-binary $dll;."
          done

          pyinstaller \
            --onefile \
            --name wefax-decoder \
            --collect-all scipy \
            --collect-all PIL \
            --hidden-import rtlsdr \
            --runtime-hook runtime_hook_rtlsdr.py \
            $BINS \
            main.py

      # ── zip にまとめて artifact としてアップロード ─────────────────────────
      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE="wefax-${{ matrix.name }}-${{ github.ref_name }}.zip"
          cd dist && zip "../${ARCHIVE}" wefax-decoder
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE="wefax-${{ matrix.name }}-${{ github.ref_name }}.zip"
          cd dist && 7z a "../${ARCHIVE}" wefax-decoder.exe
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: wefax-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

  # ────────────────────────────────────────────────────────────────────────────
  # GitHub Release の作成とファイルアップロード
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Release
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 全プラットフォームの artifact を一箇所にまとめる
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "WEFAX Decoder ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/wefax-*.zip
